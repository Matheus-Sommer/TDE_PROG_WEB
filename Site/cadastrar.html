<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Estante Comum</title>
</head>
<body>
    <h1>Crie sua conta</h1>
    <p>Cadastre-se para trocar livros com outros leitores.</p>
    <form id="cadastro" method="post">
    <p>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" autocomplete="name" required>
    </p>

    <p>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
    </p>

    <p>
        <label for="senha">Senha (mínimo de 8 caracteres)</label>
        <input type="password" id="senha" name="senha" minlength="8" autocomplete="new-password" required>
    </p>

    <button type="submit">Criar conta</button>
</form>

<a href="index.html">Já tenho conta. Voltar ao login</a>
</body>
</html>
